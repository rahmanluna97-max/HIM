
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMO ♡ DEEP</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #16020a;
  color: #ffe4d0;
  font-family: Georgia, serif;
  overflow: hidden;
}

/* =========================
   PASSWORD SCREEN
========================= */

#lock {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at center, #4c101d 0%, #290610 55%, #130208 100%);
  overflow: hidden;
}

#lock::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid #bd8867;
  pointer-events: none;
}

#lock::after {
  content: "✧";
  position: absolute;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 35px;
  color: #e9b58c;
  text-shadow: 0 0 20px #ffb48e;
}

.lock-card {
  width: 100%;
  max-width: 500px;
  padding: 45px 28px;
  text-align: center;
  position: relative;
  border: 1px solid #b98567;
  border-radius: 28px;
  background: #20040dbb;
  box-shadow: 0 0 50px #9b284533;
  animation: appear 1.5s ease;
}

.lock-card h1 {
  font-size: clamp(30px, 8vw, 48px);
  letter-spacing: 3px;
  color: #ffd6b1;
  text-shadow: 0 0 20px #ff9e91;
}

.heart {
  color: #ff7996;
  display: inline-block;
  animation: heartbeat 1.5s infinite;
}

.ornament {
  color: #d9a37d;
  font-size: 23px;
  margin: 15px 0;
}

.lock-card p {
  color: #e9bcb0;
  font-size: 14px;
  line-height: 1.9;
}

.lock-card input {
  width: 100%;
  margin-top: 28px;
  padding: 16px;
  background: #16040a;
  border: 1px solid #ca9271;
  border-radius: 30px;
  color: white;
  outline: none;
  text-align: center;
  font-size: 16px;
  letter-spacing: 4px;
}

.lock-card input:focus {
  box-shadow: 0 0 20px #e38d9366;
}

.unlock {
  padding: 14px 45px;
  margin-top: 23px;
  border-radius: 40px;
  border: 1px solid #ffb49e;
  background: linear-gradient(120deg,#74152f,#b63d57);
  color: #fff0df;
  font-family: Georgia,serif;
  font-size: 15px;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 0 20px #e45b7a55;
  transition: .4s;
}

.unlock:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px #ff9bad;
}

#error {
  color: #ff9baa;
  margin-top: 15px;
  font-size: 13px;
}

.only {
  margin-top: 25px;
  font-style: italic;
}

/* =========================
   MAIN PAGE
========================= */

#main {
  display: none;
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  text-align: center;

  background:
    radial-gradient(ellipse at 50% 65%, #542044 0%, transparent 48%),
    linear-gradient(180deg,#100c1c 0%,#200a1b 45%,#160510 100%);
}

#main::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse, transparent 35%, #08020a99 100%);
  z-index: 3;
}

/* Moon */

.moon {
  position: absolute;
  top: 8%;
  right: 11%;
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 35%,#fff0c8,#f5c4a1 45%,#bb7c83 100%);
  box-shadow: 0 0 35px #ffc2a2aa,0 0 100px #ef9f9c55;
  animation: moonGlow 5s infinite alternate;
}

.moon::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 65% 40%,#d9a69a44,transparent 65%);
}

/* Heading */

.header {
  position: relative;
  z-index: 5;
  padding: 55px 10px 0;
}

.header h1 {
  font-size: clamp(32px, 8vw, 53px);
  letter-spacing: 3px;
  color: #ffd8bb;
  text-shadow:
    0 0 10px #ff9c9c,
    0 0 30px #b84b73;
  animation: titleGlow 3s infinite alternate;
}

.header .love {
  margin-top: 18px;
  color: #ffc1cb;
  font-size: clamp(17px, 5vw, 25px);
  letter-spacing: 5px;
  text-shadow: 0 0 18px #ff7098;
}

.line {
  color: #d7a17f;
  margin: 13px auto;
  letter-spacing: 8px;
}

/* =========================
   LOTUS
========================= */

.lotus-stage {
  position: relative;
  width: 100%;
  height: 360px;
  margin: 15px auto 0;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1000px;
  z-index: 2;
}

.lotus {
  position: relative;
  width: 320px;
  height: 270px;
  transform-style: preserve-3d;
  animation: floating 5s ease-in-out infinite;
}

/* Petal design */

.petal {
  position: absolute;
  width: 92px;
  height: 160px;
  left: 114px;
  top: 45px;

  border-radius: 90% 90% 35% 35%;

  transform-origin: 50% 95%;
  transform-style: preserve-3d;

  background:
    linear-gradient(
      90deg,
      #781b42 0%,
      #bb416a 18%,
      #ed829e 38%,
      #ffd0d4 51%,
      #ed7896 70%,
      #9c2857 100%
    );

  border: 1px solid #ffb3c6;

  box-shadow:
    inset 8px 0 18px #ffffff33,
    inset -8px 0 18px #600b3555,
    0 0 15px #f17ba266;

  opacity: 0;
  animation: bloom 2.5s ease-out forwards;
}

/* Petal center vein */

.petal::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 12px;
  width: 1px;
  height: 75%;
  background: linear-gradient(transparent,#ffe6e6bb,transparent);
  box-shadow: 0 0 5px #fff;
}

/* Petal arrangement */

.p1  { transform: rotate(-80deg) scale(.72); animation-delay:.1s; }
.p2  { transform: rotate(-65deg) scale(.85); animation-delay:.2s; }
.p3  { transform: rotate(-48deg) scale(.96); animation-delay:.3s; }
.p4  { transform: rotate(-32deg); animation-delay:.4s; }
.p5  { transform: rotate(-16deg) scale(1.08); animation-delay:.5s; }
.p6  { transform: rotate(0deg) scale(1.12); animation-delay:.6s; }
.p7  { transform: rotate(16deg) scale(1.08); animation-delay:.7s; }
.p8  { transform: rotate(32deg); animation-delay:.8s; }
.p9  { transform: rotate(48deg) scale(.96); animation-delay:.9s; }
.p10 { transform: rotate(65deg) scale(.85); animation-delay:1s; }
.p11 { transform: rotate(80deg) scale(.72); animation-delay:1.1s; }

.p12 {
  transform: rotate(-28deg) scale(.7);
  background: linear-gradient(90deg,#a72b5a,#ffb6c9,#c33c71);
  animation-delay:1.2s;
}

.p13 {
  transform: rotate(28deg) scale(.7);
  background: linear-gradient(90deg,#a72b5a,#ffb6c9,#c33c71);
  animation-delay:1.3s;
}

/* Inner petals */

.inner {
  position: absolute;
  width: 65px;
  height: 120px;
  left: 127px;
  top: 75px;
  border-radius: 90% 90% 35% 35%;
  transform-origin: bottom center;
  background: linear-gradient(90deg,#d64e7c,#fff0d7,#f28ca8);
  border: 1px solid #ffe2e5;
  box-shadow: 0 0 15px #ffb3c8;
  opacity: 0;
  animation: bloom 2.5s ease-out forwards;
}

.i1 { transform: rotate(-35deg); animation-delay:1.4s; }
.i2 { transform: rotate(-17deg); animation-delay:1.5s; }
.i3 { transform: rotate(0deg); animation-delay:1.6s; }
.i4 { transform: rotate(17deg); animation-delay:1.7s; }
.i5 { transform: rotate(35deg); animation-delay:1.8s; }

/* Golden center */

.center {
  position: absolute;
  width: 45px;
  height: 45px;
  top: 172px;
  left: 137px;
  border-radius: 50%;
  z-index: 5;

  background:
    radial-gradient(circle,#fff8bd 0%,#f8bb52 35%,#a75b20 100%);

  box-shadow: 0 0 20px #ffd36e,0 0 45px #ffab4d;
  animation: centerGlow 2s infinite alternate;
}

/* Lotus pollen */

.center::before {
  content: "✦ ✧ ✦";
  position: absolute;
  width: 100px;
  left: -27px;
  top: 12px;
  font-size: 12px;
  color: #fff0a3;
  text-align: center;
}

/* =========================
   WATER AND REFLECTION
========================= */

.water {
  position: absolute;
  width: 100%;
  height: 170px;
  bottom: 0;
  left: 0;

  background:
    linear-gradient(180deg,
      transparent,
      #260b25 15%,
      #130816 100%);
}

.reflection {
  position: absolute;
  width: 270px;
  height: 100px;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  background: linear-gradient(
    180deg,
    #ff94b544,
    transparent 80%
  );
  filter: blur(12px);
  animation: reflection 3s infinite alternate;
}

/* Water ripple */

.ripple {
  position: absolute;
  left: 50%;
  bottom: 65px;
  transform: translateX(-50%);
  width: 150px;
  height: 30px;
  border: 1px solid #f3a3bd99;
  border-radius: 50%;
  animation: ripple 3s infinite;
}

.r2 {
  animation-delay: 1s;
  width: 180px;
}

.r3 {
  animation-delay: 2s;
  width: 210px;
}

/* =========================
   FALLING PETALS
========================= */

.falling {
  position: absolute;
  top: -40px;
  color: #ff9cb8;
  font-size: 23px;
  z-index: 4;
  pointer-events: none;
  animation: falling 9s linear infinite;
}

.f1 { left: 10%; animation-delay: 0s; }
.f2 { left: 30%; animation-delay: 2s; }
.f3 { left: 65%; animation-delay: 4s; }
.f4 { left: 85%; animation-delay: 1s; }
.f5 { left: 50%; animation-delay: 5s; }

/* Stars */

.star {
  position: absolute;
  color: #ffd4a4;
  z-index: 1;
  animation: starGlow 2s infinite alternate;
}

.st1 { top: 24%; left: 12%; }
.st2 { top: 32%; right: 15%; }
.st3 { top: 56%; left: 20%; }
.st4 { top: 68%; right: 17%; }

/* Footer */

.footer {
  position: relative;
  z-index: 5;
  margin-top: 10px;
  padding-bottom: 35px;
  color: #e8b4c0;
  font-size: 15px;
  font-style: italic;
  letter-spacing: 3px;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes bloom {
  0% {
    opacity: 0;
    filter: brightness(.5);
    transform-origin: bottom center;
  }
  100% {
    opacity: 1;
    filter: brightness(1);
  }
}

@keyframes floating {
  0%,100% {
    transform: translateY(0) rotateX(0deg);
  }
  50% {
    transform: translateY(-15px) rotateX(5deg);
  }
}

@keyframes heartbeat {
  50% { transform: scale(1.25); }
}

@keyframes titleGlow {
  from { text-shadow: 0 0 8px #ff809c; }
  to { text-shadow: 0 0 30px #ffb5c8,0 0 50px #b84b73; }
}

@keyframes moonGlow {
  to { box-shadow: 0 0 65px #ffc2a2,0 0 130px #ef9f9c77; }
}

@keyframes centerGlow {
  to { box-shadow: 0 0 35px #ffd36e,0 0 65px #ffab4d; }
}

@keyframes reflection {
  from { opacity: .4; transform: translateX(-50%) scaleX(.8); }
  to { opacity: .9; transform: translateX(-50%) scaleX(1.2); }
}

@keyframes ripple {
  0% { transform: translateX(-50%) scale(.6); opacity:.8; }
  100% { transform: translateX(-50%) scale(1.7); opacity:0; }
}

@keyframes falling {
  0% { transform: translateY(-30px) rotate(0deg); opacity:0; }
  10% { opacity:.9; }
  90% { opacity:.7; }
  100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
}

@keyframes starGlow {
  from { opacity:.2; transform:scale(.7); }
  to { opacity:1; transform:scale(1.4); }
}

@keyframes appear {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

/* Mobile */

@media(max-width:480px) {
  .lock-card { padding: 35px 20px; }
  .moon { width:65px; height:65px; }
  .header { padding-top:65px; }
  .lotus-stage { transform:scale(.88); margin-top:5px; }
  .footer { margin-top:0; }
}

</style>
</head>

<body>

<!-- PASSWORD HOME -->

<div id="lock">

  <div class="lock-card">

    <h1>
      LUMO <span class="heart">♡</span> DEEP
    </h1>

    <div class="ornament">──── ✧ ────</div>

    <p>
      This little world is locked...<br>
      Enter the password to continue.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <br>

    <button class="unlock" onclick="unlock()">
      UNLOCK ♡
    </button>

    <div id="error"></div>

    <div class="ornament">──── ✧ ────</div>

    <p class="only">Only for you...</p>

  </div>

</div>


<!-- MAIN LOVE WEBSITE -->

<div id="main">

  <div class="moon"></div>

  <div class="star st1">✦</div>
  <div class="star st2">✧</div>
  <div class="star st3">✦</div>
  <div class="star st4">✧</div>

  <div class="falling f1">❀</div>
  <div class="falling f2">✿</div>
  <div class="falling f3">❀</div>
  <div class="falling f4">✿</div>
  <div class="falling f5">❀</div>

  <header class="header">

    <div class="line">────── ✧ ──────</div>

    <h1>
      LUMO <span class="heart">♡</span> DEEP
    </h1>

    <div class="line">────── ✧ ──────</div>

    <p class="love">
      I LOVE YOU, SIR
    </p>

    <div class="line">────── ✧ ──────</div>

  </header>


  <!-- ANIMATED LOTUS -->

  <section class="lotus-stage">

    <div class="lotus">

      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="petal p12"></div>
      <div class="petal p13"></div>

      <div class="inner i1"></div>
      <div class="inner i2"></div>
      <div class="inner i3"></div>
      <div class="inner i4"></div>
      <div class="inner i5"></div>

      <div class="center"></div>

    </div>

    <div class="reflection"></div>

  </section>


  <!-- WATER -->

  <div class="water"></div>

  <div class="ripple"></div>
  <div class="ripple r2"></div>
  <div class="ripple r3"></div>


  <footer class="footer">
    ✧ Forever & Always ✧
  </footer>

</div>


<!-- JAVASCRIPT -->

<script>

function unlock() {

  const pass =
    document.getElementById("password").value;

  if (pass === "DEEPMO") {

    document.getElementById("lock").style.display = "none";

    document.getElementById("main").style.display = "block";

    document.body.style.overflow = "auto";

  } else {

    document.getElementById("error").innerText =
      "Wrong password! Try again ♡";

  }

}

document.getElementById("password")
.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    unlock();
  }

});

</script>

</body>
</html>
